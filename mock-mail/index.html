<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тестовая почта</title>
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #3b5bdb; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #f3f5f9; }
  header { background: #0b1220; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 0; color: #93a1bd; font-size: 12px; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  main { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: #fff; }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: #f8fafc; }
  .item.on { background: #edf1ff; }
  .item b { display: block; }
  .item span { display: block; color: var(--muted); font-size: 12px; }
  #view { overflow-y: auto; padding: 20px 24px; }
  dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; margin: 0 0 16px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-word; }
  iframe { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  pre { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .empty { padding: 40px 20px; color: var(--muted); text-align: center; }
  a.att { display: inline-block; margin: 0 8px 8px 0; padding: 5px 12px; border-radius: 99px; background: #edf1ff; color: var(--brand); text-decoration: none; font-weight: 600; }
  .tabs { margin: 0 0 10px; }
  .tabs button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
</style>
</head>
<body>
<header>
  <div><h1>Тестовая почта</h1><p>SMTP-приёмник для проверки уведомлений: письма наружу не уходят</p></div>
  <button id="clear">Очистить</button>
</header>
<main>
  <div id="list"></div>
  <div id="view"><div class="empty">Выберите письмо слева</div></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let current = null;
  let mode = 'html';

  async function loadList() {
    const list = await (await fetch('/api/messages')).json();
    $('list').innerHTML = list.length ? list.map((m) => `
      <div class="item ${m.id === current ? 'on' : ''}" data-id="${m.id}">
        <b>${esc(m.subject)}</b>
        <span>Кому: ${esc(m.envelopeTo.join(', '))}</span>
        <span>${new Date(m.receivedAt).toLocaleString('ru-RU')}${m.attachments ? ' · вложений: ' + m.attachments : ''}</span>
      </div>`).join('') : '<div class="empty">Писем пока нет</div>';
  }

  async function show(id) {
    current = id;
    const m = await (await fetch('/api/messages/' + id)).json();
    const body = mode === 'html' && m.html
      ? `<iframe sandbox srcdoc="${esc(m.html)}"></iframe>`
      : `<pre>${esc(m.text || '(нет текстовой версии)')}</pre>`;
    $('view').innerHTML = `
      <dl>
        <dt>Тема</dt><dd><b>${esc(m.subject)}</b></dd>
        <dt>От</dt><dd>${esc(m.from)}</dd>
        <dt>Кому</dt><dd>${esc(m.to)}</dd>
        <dt>Конверт</dt><dd>${esc(m.envelopeFrom)} - ${esc(m.envelopeTo.join(', '))}</dd>
      </dl>
      ${m.attachments.map((a, i) => `<a class="att" href="/api/messages/${m.id}/attachments/${i}">${esc(a.name)} (${a.size} Б)</a>`).join('')}
      <div class="tabs">
        <button data-mode="html" class="${mode === 'html' ? 'on' : ''}">HTML</button>
        <button data-mode="text" class="${mode === 'text' ? 'on' : ''}">Текст</button>
      </div>
      ${body}`;
    loadList();
  }

  document.addEventListener('click', (e) => {
    const item = e.target.closest('.item');
    if (item) show(Number(item.dataset.id));
    const tab = e.target.closest('[data-mode]');
    if (tab) { mode = tab.dataset.mode; show(current); }
  });
  $('clear').onclick = async () => { await fetch('/api/messages', { method: 'DELETE' }); current = null; $('view').innerHTML = '<div class="empty">Выберите письмо слева</div>'; loadList(); };
  loadList();
  setInterval(loadList, 3000);
</script>
</body>
</html>
